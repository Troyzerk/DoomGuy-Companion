name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch Freedoom
        shell: pwsh
        run: ./tools/get-freedoom.ps1
      - name: Build
        run: dotnet build DoomGuy.csproj -c Release
      - name: Test
        run: dotnet test Tests/DoomGuy.Tests.csproj -c Release
